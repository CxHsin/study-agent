[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minimal-agent"
version = "0.1.0"
description = "A minimal Agent Harness built one learning step at a time."
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
minimal-agent = "minimal_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
